version: '3.8'

services:
  # 转账交易流式处理服务（简化版）
  transfer-stream:
    build:
      context: .
      dockerfile: Dockerfile
    image: ethereum-etl:transfer-stream-simple
    container_name: ethereum-etl-transfer-stream
    volumes:
      # 数据输出目录
      - ./data:/app/data
      # 日志目录
      - ./logs:/app/logs
      # 同步状态文件目录
      - ./state:/app/state
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      # 环境变量，可通过.env文件覆盖
      - PROVIDER_URI=${PROVIDER_URI:-https://mainnet.infura.io}
      - START_BLOCK=${START_BLOCK:-}
      - PERIOD_SECONDS=${PERIOD_SECONDS:-10}
      - BATCH_SIZE=${BATCH_SIZE:-100}
      - MAX_WORKERS=${MAX_WORKERS:-5}
      - LAG=${LAG:-0}
      - OUTPUT_FILE=${OUTPUT_FILE:-/app/data/transfer_transactions.csv}
      - LOG_FILE=${LOG_FILE:-/app/logs/transfer_stream.log}
      - PID_FILE=${PID_FILE:-/app/state/transfer_stream.pid}
      - LAST_SYNCED_BLOCK_FILE=${LAST_SYNCED_BLOCK_FILE:-/app/state/last_synced_transfer_block.txt}
      - EXPORT_BLOCKS=${EXPORT_BLOCKS:-false}
      - EXPORT_TRANSACTIONS=${EXPORT_TRANSACTIONS:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; print('Transfer stream is healthy' if os.path.exists('/app/state/transfer_stream.pid') else exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      python ethereumetl/cli/stream_transfer_transactions.py
      --provider-uri ${PROVIDER_URI}
      --transfer-transactions-output ${OUTPUT_FILE}
      --last-synced-block-file ${LAST_SYNCED_BLOCK_FILE}
      --lag ${LAG}
      --period-seconds ${PERIOD_SECONDS}
      --batch-size ${BATCH_SIZE}
      --max-workers ${MAX_WORKERS}
      --log-file ${LOG_FILE}
      --pid-file ${PID_FILE}
      ${START_BLOCK:+--start-block ${START_BLOCK}}
      ${EXPORT_BLOCKS:+--export-blocks}
      ${EXPORT_TRANSACTIONS:+--export-transactions}

networks:
  default:
    driver: bridge 